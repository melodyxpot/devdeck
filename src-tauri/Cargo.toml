[package]
name = "devdeck"
version = "0.1.0"
description = "DevDeck — professional developer command center"
authors = ["DevDeck"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
which = "7"

[dev-dependencies]
tempfile = "3"
